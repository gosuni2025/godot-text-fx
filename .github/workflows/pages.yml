name: Build and deploy web editor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and web export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz' | sha256sum -c -
          unzip -q godot.zip
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          unzip -q -j templates.tpz 'templates/web_nothreads_*.zip' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Stamp, import, and export
        run: |
          python3 addons/game_base/tools/stamp_build.py web --project . --build-number "$GITHUB_RUN_NUMBER"
          godot --headless --audio-driver Dummy --path . --import
          mkdir -p build/web
          godot --headless --audio-driver Dummy --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
